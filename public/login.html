<!DOCTYPE html>
<html>
<head>
    <title>Login AquaGuard</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        input, button {
            padding: 10px;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div>
    <h2>AquaGuard Login</h2>
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Connexion</button>
</div>

<script>
function login() {
    fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password.value })
    })
    .then(res => {
        if (res.ok) window.location.href = "/";
        else alert("Mot de passe incorrect");
    });
}
</script>

</body>
</html>
